version: 2
updates:
  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "snowflakedb/snowflake"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "terraform"
    open-pull-requests-limit: 5
